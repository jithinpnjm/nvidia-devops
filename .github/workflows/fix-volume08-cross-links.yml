name: Fix Volume 08 cross-links

on:
  push:
    branches:
      - book/volume-08-infiniband
    paths:
      - .github/workflows/fix-volume08-cross-links.yml

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: book/volume-08-infiniband
      - name: Convert unpublished cross-volume links
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('docs/nvidia-zero-to-hero/volume-08')
          changed = []
          for path in root.rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('](../volume-07/', '](pathname://../volume-07/')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('\n'.join(changed))
          PY
      - name: Commit link corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nvidia-zero-to-hero/volume-08
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "fix Volume 08 cross-links before Volume 07 merge"
            git push origin HEAD:book/volume-08-infiniband
          fi
